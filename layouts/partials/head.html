<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} - {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ site.Description }}{{ end }}">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ site.Title }}{{ end }}">
  <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ site.Description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ site.BaseURL }}images/og-image.jpg">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ site.Description }}{{ end }}">
  <meta name="twitter:image" content="{{ site.BaseURL }}images/twitter-card.jpg">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ site.BaseURL }}favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.BaseURL }}images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.BaseURL }}images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="{{ site.BaseURL }}images/apple-touch-icon.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ .Permalink }}">
</head>
