<!DOCTYPE html>
<html lang="en">
{{ partial "head.html" . }}
<body class="bg-charcoal">
  
  <!-- Hero Section -->
  <section class="section-container bg-charcoal relative overflow-hidden">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-display-mobile md:text-display font-garamond italic font-semibold text-warm-cream mb-6 animate-fade-in">
        Recommendations
      </h1>
      <p class="text-xl md:text-2xl font-garamond text-warm-cream/80 max-w-3xl mx-auto animate-fade-in">
        Words from colleagues, mentors, and students I've had the privilege of working with
      </p>
    </div>
  </section>

  <!-- Testimonials Section -->
  <section class="section-container bg-charcoal relative overflow-hidden">
    <!-- Background decoration -->
    <div class="absolute inset-0 opacity-5">
      <div class="absolute top-10 left-10 w-32 h-32 bg-fireweed-magenta rounded-full blur-3xl"></div>
      <div class="absolute bottom-10 right-10 w-48 h-48 bg-rose-purple rounded-full blur-3xl"></div>
    </div>
    
    <div class="max-w-4xl mx-auto relative z-10">
      <!-- Back Button -->
      <div class="mb-8 animate-fade-in">
        <a href="/" class="inline-flex items-center gap-2 text-warm-cream/80 hover:text-warm-cream transition-colors font-garamond">
          <i class="fas fa-arrow-left"></i>
          Back to Home
        </a>
      </div>
      
      {{ partial "testimonials.html" . }}
    </div>
  </section>
  
  {{ partial "footer.html" . }}
</body>
</html>
